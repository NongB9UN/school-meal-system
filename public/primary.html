<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>จอใหญ่ – ประถม</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --primary: #6366f1;
      --allergy: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
      --room-font: 2.6vh;
      --room-num-font: 3vh;
      --room-pad-y: 0.6vh;
      --room-gap: 0.8vh;
      --tag-font: 1.55vh;
    }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Sarabun", "Segoe UI", sans-serif;
      overflow: hidden;
    }
    body { padding: 2vh 2vw; display: flex; flex-direction: column; }

    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.5vh;
    }
    .title {
      font-size: 4.2vh; font-weight: 900;
      color: var(--primary);
      display: flex; align-items: center; gap: 1.2vw;
    }
    .title .badge {
      background: var(--primary); color: #fff;
      font-size: 2.4vh; padding: 0.4vh 1.4vw; border-radius: 999px;
      font-weight: 700;
    }
    .status {
      display: flex; align-items: center; gap: 1vw;
      font-size: 2.1vh; color: var(--muted);
    }
    .dot { width: 1.4vh; height: 1.4vh; border-radius: 50%; background: #22c55e; }
    .dot.loading { background: #eab308; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .nav-link {
      background: var(--card); color: var(--text);
      text-decoration: none; font-size: 2vh; font-weight: 700;
      padding: 1vh 1.6vw; border-radius: 12px; border: 2px solid #334155;
    }
    button.nav-link {
      font-family: inherit;
      cursor: pointer;
    }

    .totals { display: flex; gap: 1.5vw; margin-bottom: 1.5vh; }
    .total-card {
      flex: 1; background: var(--card); border-radius: 20px; padding: 2vh 1.5vw;
      display: flex; flex-direction: column; align-items: center;
      border: 3px solid var(--primary);
    }
    .total-card.lower { border-color: #06b6d4; }
    .total-card.lower .num { color: #22d3ee; }
    .total-card.upper { border-color: #8b5cf6; }
    .total-card.upper .num { color: #a78bfa; }
    .total-card .label { font-size: 2.6vh; color: var(--muted); font-weight: 700; margin-bottom: 0.5vh; }
    .total-card .num   { font-size: 9vh; font-weight: 900; line-height: 1; color: var(--primary); }
    .total-card .sub   { font-size: 2vh; color: var(--muted); margin-top: 0.5vh; }

    .bottom { flex: 1; display: flex; gap: 1.5vw; min-height: 0; }
    .rooms-col { flex: 2; background: var(--card); border-radius: 20px; padding: 1.5vh 1.2vw; display: flex; flex-direction: column; min-height: 0; }
    .rooms-col h2 {
      font-size: 2.8vh; font-weight: 800; color: var(--primary);
      margin-bottom: 1vh; padding-bottom: 1vh; border-bottom: 2px solid #334155;
      display: flex; justify-content: space-between;
    }
    .rooms-col h2 .cnt { font-size: 3.4vh; font-weight: 900; }
    .room-grid {
      flex: 1; overflow: hidden;
      display: grid; grid-template-columns: 1fr 1fr; gap: var(--room-gap) 1.5vw; align-content: start;
    }
    .room-row {
      display: flex; align-items: center; justify-content: space-between;
      font-size: var(--room-font); padding: var(--room-pad-y) 0.8vw; background: #0f172a; border-radius: 10px;
      min-height: 0;
    }
    .room-row .rmain { display: flex; align-items: center; gap: 0.7vw; min-width: 0; }
    .room-row .rname { font-weight: 700; }
    .room-row .tag {
      font-size: var(--tag-font); font-weight: 800; padding: 0.22vh 0.55vw;
      border-radius: 999px; white-space: nowrap;
    }
    .room-row .tag.default { color: #c7d2fe; background: rgba(99, 102, 241, 0.18); border: 1px solid rgba(99, 102, 241, 0.55); }
    .room-row .tag.reported { color: #bbf7d0; background: rgba(34, 197, 94, 0.16); border: 1px solid rgba(34, 197, 94, 0.5); }
    .room-row .rnum  { font-weight: 900; font-size: var(--room-num-font); color: var(--primary); }

    .allergy-col {
      flex: 1; background: var(--card); border-radius: 20px; padding: 1.5vh 1.2vw;
      display: flex; flex-direction: column; min-height: 0; border: 3px solid var(--allergy);
    }
    .allergy-col h2 {
      font-size: 2.8vh; font-weight: 800; color: var(--allergy);
      margin-bottom: 1vh; padding-bottom: 1vh; border-bottom: 2px solid #334155;
    }
    .allergy-list { flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 0.8vh; }
    .allergy-row {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 2.6vh; padding: 0.7vh 0.9vw; background: #0f172a; border-radius: 10px;
    }
    .allergy-row .aname { font-weight: 700; }
    .allergy-row .anum { font-weight: 900; font-size: 3vh; color: var(--allergy); }
    .empty { color: var(--muted); font-size: 2.2vh; text-align: center; margin-top: 2vh; }
    .clock { font-size: 2.1vh; color: var(--muted); }

    @media (max-height: 820px) {
      body { padding: 1.1vh 1.5vw; }
      .topbar { margin-bottom: 0.8vh; }
      .title { font-size: 3.3vh; }
      .title .badge { font-size: 1.9vh; padding: 0.3vh 1vw; }
      .status { font-size: 1.75vh; gap: 0.7vw; }
      .nav-link { font-size: 1.65vh; padding: 0.65vh 1.1vw; border-radius: 9px; }
      .totals { margin-bottom: 0.8vh; }
      .total-card { border-radius: 14px; padding: 0.9vh 1vw; }
      .total-card .label { font-size: 2vh; margin-bottom: 0.25vh; }
      .total-card .num { font-size: 6.7vh; }
      .total-card .sub { font-size: 1.6vh; margin-top: 0.2vh; }
      .rooms-col,
      .allergy-col { border-radius: 14px; padding: 1vh 0.9vw; }
      .rooms-col h2,
      .allergy-col h2 { font-size: 2.2vh; margin-bottom: 0.6vh; padding-bottom: 0.6vh; }
      .rooms-col h2 .cnt { font-size: 2.6vh; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="title">🎒 ประถม <span class="badge">จอครัว</span></div>
    <div class="status">
      <span class="clock" id="clock"></span>
      <span class="dot" id="dot"></span>
      <span id="syncText">กำลังโหลด...</span>
      <button class="nav-link" type="button" onclick="fetchData(true)">รีเฟรช</button>
      <a class="nav-link" href="./kinder.html">← ไปจออนุบาล</a>
    </div>
  </div>

  <div class="totals">
    <div class="total-card">
      <div class="label">ยอดรวมประถม</div>
      <div class="num" id="sumTotal">0</div>
      <div class="sub" id="sumRooms">0 ห้อง</div>
    </div>
    <div class="total-card lower">
      <div class="label">ประถมต้น</div>
      <div class="num" id="lowerTotal">0</div>
      <div class="sub" id="lowerRooms">ป.1-ป.3</div>
    </div>
    <div class="total-card upper">
      <div class="label">ประถมปลาย</div>
      <div class="num" id="upperTotal">0</div>
      <div class="sub" id="upperRooms">ป.4-ป.6</div>
    </div>
  </div>

  <div class="bottom">
    <div class="rooms-col">
      <h2>🎒 รายห้องประถม <span class="cnt" id="roomCnt">0 คน</span></h2>
      <div class="room-grid" id="roomList"></div>
    </div>
    <div class="allergy-col">
      <h2>⚠️ รายการพิเศษวันนี้</h2>
      <div class="allergy-list" id="allergyList"></div>
    </div>
  </div>

<script>
  const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbztuN4_muVke5ZhhpDJmLrxFJJinMb74P0T-P2LTP3ggXJCBqPhb49JCMitSLZfjy5X/exec";
  const REFRESH_FAST_MS = 15000;
  const REFRESH_SLOW_MS = 60000;
  const PRIMARY_CLASSROOMS = [
    "ป.1/1", "ป.1/2", "ป.1/3", "ป.1/4",
    "ป.2/1", "ป.2/2", "ป.2/3",
    "ป.3/1", "ป.3/2", "ป.3/3", "ป.3/4",
    "ป.4/1", "ป.4/2", "ป.4/3",
    "ป.5/1", "ป.5/2", "ป.5/3",
    "ป.6/1", "ป.6/2", "ป.6/3",
  ];
  const PRIMARY_DEFAULT_COUNTS = {
    "ป.1/1": 21, "ป.1/2": 19, "ป.1/3": 40, "ป.1/4": 33,
    "ป.2/1": 28, "ป.2/2": 42, "ป.2/3": 32,
    "ป.3/1": 24, "ป.3/2": 39, "ป.3/3": 34, "ป.3/4": 24,
    "ป.4/1": 23, "ป.4/2": 35, "ป.4/3": 27,
    "ป.5/1": 10, "ป.5/2": 42, "ป.5/3": 30,
    "ป.6/1": 15, "ป.6/2": 36, "ป.6/3": 39,
  };
  const PRIMARY_LOWER_GRADES = ["ป.1", "ป.2", "ป.3"];
  const PRIMARY_UPPER_GRADES = ["ป.4", "ป.5", "ป.6"];
  const LOCAL_MOCK_RAW = {
    "ประถม": [
      { "วันที่": todayGoogle(), "เวลา": "08:10", "ห้อง": "ป.1/3", "จำนวนกิน": 38, "แพ้อาหาร": "แพ้นม:1", "สถานะ": "รับอาหาร" },
      { "วันที่": todayGoogle(), "เวลา": "08:18", "ห้อง": "ป.5/1", "จำนวนกิน": 0, "แพ้อาหาร": "", "สถานะ": "ไม่รับอาหาร" },
    ],
  };

  function thaiDateKey(date) {
    return date.toLocaleDateString("th-TH", { timeZone: "Asia/Bangkok" });
  }
  function sheetDateKey(value) {
    if (!value) return "";
    if (value instanceof Date && !Number.isNaN(value.getTime())) return thaiDateKey(value);

    const text = String(value).trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(text)) return text;

    const iso = text.match(/^(\d{4})-(\d{2})-(\d{2})(.*)$/);
    if (iso) {
      const year = Number(iso[1]);
      const normalizedYear = year > 2400 ? year - 543 : year;
      const parsed = new Date(`${normalizedYear}-${iso[2]}-${iso[3]}${iso[4]}`);
      if (!Number.isNaN(parsed.getTime())) return thaiDateKey(parsed);
    }

    return text;
  }
  function todayThai() { return thaiDateKey(new Date()); }
  function todayGoogle() {
    const parts = new Intl.DateTimeFormat("en-CA", {
      timeZone: "Asia/Bangkok",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
    }).formatToParts(new Date());
    const byType = Object.fromEntries(parts.map(part => [part.type, part.value]));
    return `${byType.year}-${byType.month}-${byType.day}`;
  }
  function textToAllergies(text) {
    if (!text || typeof text !== "string") return [];
    return text.split(",").map(p => {
      const [name, count] = p.split(":");
      return { name:(name||"").trim(), count: parseInt(count)||1 };
    }).filter(a => a.name);
  }
  function fmtTime(d){ return d.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"}); }
  function isNoMeal(row) {
    return (row["สถานะ"] || row.status || "").trim() === "ไม่รับอาหาร";
  }

  function processPrimary(raw) {
    const today = todayThai();
    const googleToday = todayGoogle();
    const byRoom = {};
    (raw["ประถม"] || []).forEach(r => {
      const rowDate = sheetDateKey(r["วันที่"]);
      if (rowDate !== today && rowDate !== googleToday) return;
      const room = r["ห้อง"];
      if (!room) return;
      if (isNoMeal(r)) {
        byRoom[room] = { room, total: 0, allergies: [], noMeal: true };
        return;
      }
      byRoom[room] = {
        room,
        total: parseInt(r["จำนวนกิน"]) || 0,
        allergies: textToAllergies(r["แพ้อาหาร"]),
        source: "reported",
      };
    });
    PRIMARY_CLASSROOMS.forEach(room => {
      if (byRoom[room]) return;
      byRoom[room] = {
        room,
        total: PRIMARY_DEFAULT_COUNTS[room] || 0,
        allergies: [],
        source: "default",
      };
    });
    return PRIMARY_CLASSROOMS.map(room => byRoom[room]).filter(r => r && !r.noMeal);
  }

  function render(rows) {
    const sum = rows.reduce((s,r)=>s+r.total,0);
    const lowerRows = rows.filter(r => PRIMARY_LOWER_GRADES.some(grade => r.room.startsWith(grade)));
    const upperRows = rows.filter(r => PRIMARY_UPPER_GRADES.some(grade => r.room.startsWith(grade)));
    const lowerSum = lowerRows.reduce((s,r)=>s+r.total,0);
    const upperSum = upperRows.reduce((s,r)=>s+r.total,0);
    document.getElementById("sumTotal").textContent = sum;
    document.getElementById("sumRooms").textContent = rows.length + " ห้อง";
    document.getElementById("lowerTotal").textContent = lowerSum;
    document.getElementById("lowerRooms").textContent = lowerRows.length + " ห้อง · ป.1-ป.3";
    document.getElementById("upperTotal").textContent = upperSum;
    document.getElementById("upperRooms").textContent = upperRows.length + " ห้อง · ป.4-ป.6";
    document.getElementById("roomCnt").textContent = sum + " คน";

    document.getElementById("roomList").innerHTML = rows.length
      ? rows.map(r => `
          <div class="room-row">
            <span class="rmain">
              <span class="rname">${r.room}</span>
              <span class="tag ${r.source === "default" ? "default" : "reported"}">${r.source === "default" ? "ตั้งต้น" : "แจ้งแล้ว"}</span>
            </span>
            <span class="rnum">${r.total}</span>
          </div>
        `).join("")
      : `<div class="empty">— ยังไม่มีข้อมูล —</div>`;

    const amap = {};
    rows.forEach(r => r.allergies.forEach(a => { amap[a.name]=(amap[a.name]||0)+a.count; }));
    const entries = Object.entries(amap);
    document.getElementById("allergyList").innerHTML = entries.length
      ? entries.map(([n,c])=>`<div class="allergy-row"><span class="aname">${n}</span><span class="anum">${c}</span></div>`).join("")
      : `<div class="empty">— ไม่มีรายการพิเศษ —</div>`;

    fitRoomGrid();
  }

  function fitRoomGrid() {
    const grid = document.getElementById("roomList");
    const rows = Array.from(grid.querySelectorAll(".room-row"));
    if (!rows.length) return;

    document.documentElement.style.setProperty("--room-font", "2.6vh");
    document.documentElement.style.setProperty("--room-num-font", "3vh");
    document.documentElement.style.setProperty("--room-pad-y", "0.6vh");
    document.documentElement.style.setProperty("--room-gap", "0.8vh");
    document.documentElement.style.setProperty("--tag-font", "1.55vh");

    requestAnimationFrame(() => {
      const columns = getComputedStyle(grid).gridTemplateColumns.split(" ").length || 1;
      const rowsPerColumn = Math.ceil(rows.length / columns);
      const available = grid.clientHeight;
      if (!available || !rowsPerColumn) return;

      const currentGap = parseFloat(getComputedStyle(grid).rowGap) || 0;
      const currentRow = Math.max(...rows.map(row => row.getBoundingClientRect().height));
      const needed = currentRow * rowsPerColumn + currentGap * (rowsPerColumn - 1);
      if (needed <= available) return;

      const scale = Math.max(0.58, Math.min(1, available / needed));
      document.documentElement.style.setProperty("--room-font", `${2.6 * scale}vh`);
      document.documentElement.style.setProperty("--room-num-font", `${3 * scale}vh`);
      document.documentElement.style.setProperty("--room-pad-y", `${0.6 * scale}vh`);
      document.documentElement.style.setProperty("--room-gap", `${0.8 * scale}vh`);
      document.documentElement.style.setProperty("--tag-font", `${1.55 * scale}vh`);
    });
  }

  function getRefreshMode() {
    const now = new Date();
    const minutes = now.getHours() * 60 + now.getMinutes();
    if (minutes >= 6 * 60 && minutes < 10 * 60 + 30) {
      return { active: true, interval: REFRESH_FAST_MS, label: "ซิงค์ทุก 15 วิ" };
    }
    if (minutes >= 10 * 60 + 30 && minutes < 13 * 60) {
      return { active: true, interval: REFRESH_SLOW_MS, label: "ซิงค์ทุก 60 วิ" };
    }
    return { active: false, interval: REFRESH_SLOW_MS, label: "นอกเวลาซิงค์อัตโนมัติ" };
  }

  async function fetchData(force = false) {
    const dot = document.getElementById("dot");
    const syncText = document.getElementById("syncText");
    const mode = getRefreshMode();
    if (!force && !mode.active) {
      syncText.textContent = mode.label + " · กดรีเฟรชเองได้";
      return;
    }
    dot.classList.add("loading");
    syncText.textContent = "กำลังซิงค์...";
    try {
      let raw = LOCAL_MOCK_RAW;
      if (location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
        const res = await fetch(SHEET_API_URL);
        raw = await res.json();
      }
      render(processPrimary(raw));
      syncText.textContent = "อัปเดต " + fmtTime(new Date()) + " · " + (force ? "รีเฟรชเอง" : mode.label);
    } catch(e) {
      syncText.textContent = "เชื่อมต่อไม่ได้ – จะลองใหม่";
    } finally {
      dot.classList.remove("loading");
    }
  }

  function scheduleFetch() {
    const mode = getRefreshMode();
    fetchData(false).finally(() => {
      setTimeout(scheduleFetch, mode.active ? mode.interval : REFRESH_SLOW_MS);
    });
  }

  function tickClock() {
    document.getElementById("clock").textContent =
      new Date().toLocaleDateString("th-TH",{weekday:"long",day:"numeric",month:"long"});
  }

  tickClock();
  scheduleFetch();
  setInterval(tickClock, 60000);
  window.addEventListener("resize", fitRoomGrid);
</script>
</body>
</html>
